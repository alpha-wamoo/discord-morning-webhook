name: Morning Message

on:
  schedule:
    - cron: "12 23 * * *" # UTC 23:00 = JST 8:00
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
        
      - run: npm install
      - run: curl -fsSL https://ollama.com/install.sh | sh
      - run: npm i ollama
      - run: ollama serve &
      - run: ollama pull qwen2.5:7b
      - run: ollama create discord-morning -f Ollama/discord-morning.modelfile
      - run: npm start
        env:
          GPT_API_KEY: ${{ secrets.GPT_API_KEY }}
          GPT_API_KEY_V2: ${{ secrets.GPT_API_KEY_V2 }}
          DISCORD_WEBHOOK_GENERAL: ${{ secrets.DISCORD_WEBHOOK_GENERAL }}
          DISCORD_WEBHOOK_PHRASE: ${{ secrets.DISCORD_WEBHOOK_PHRASE }}
          DISCORD_WEBHOOK_TEST: ${{ secrets.DISCORD_WEBHOOK_TEST }}
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          IS_DEBUG: ${{ vars.IS_DEBUG }}